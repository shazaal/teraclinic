<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samastha Professional Majlis - Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --primary-color: #0c3b2e; /* Deep Emerald */
            --accent-color: #d4af37;  /* Gold */
            --bg-color: #f3f4f6;
            --text-dark: #1f2937;
            --text-light: #9ca3af;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- MAIN CONTAINER --- */
        .majlis-container {
            display: flex;
            flex-wrap: wrap;
            background: var(--white);
            max-width: 1000px;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        /* --- LEFT SIDE: INFO SECTION --- */
        .info-section {
            flex: 1;
            min-width: 300px;
            background: var(--primary-color);
            color: var(--white);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        /* Decorative Pattern (Optional) */
        .info-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, rgba(212, 175, 55, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.3;
            pointer-events: none;
        }

        .event-badge {
            background: var(--accent-color);
            color: var(--primary-color);
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            width: fit-content;
        }

        .info-section h1 {
            font-size: 2.5rem;
            line-height: 1.2;
            margin-bottom: 20px;
            font-family: 'Georgia', serif; /* Serif for elegance */
        }

        .info-section p {
            opacity: 0.9;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .event-details {
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 20px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .detail-item i {
            width: 30px;
            color: var(--accent-color);
            font-size: 1.1rem;
        }

        /* --- RIGHT SIDE: FORM SECTION --- */
        .form-section {
            flex: 1;
            min-width: 350px;
            padding: 40px;
            background: var(--white);
        }

        .form-section h2 {
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            transition: 0.3s;
        }

        .input-group input {
            width: 100%;
            padding: 12px 12px 12px 45px; /* Space for icon */
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: 0.3s;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
        }

        .input-group input:focus + i {
            color: var(--primary-color);
        }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-color), #0f5132);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button.submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(12, 59, 46, 0.3);
        }

        /* Status Messages */
        #form-status {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
        .status-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .status-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .majlis-container { flex-direction: column; }
            .info-section { padding: 30px; }
            .form-section { padding: 30px; }
        }
    </style>
</head>
<body>

<div class="majlis-container">
    
    <div class="info-section">
        <div class="event-badge">INVITATION ONLY</div>
        <h1>Samastha Professional Majlis</h1>
        <p>Join the elite gathering of Doctors, Engineers, Advocates, Professors, and Techies.</p>
        
        <div class="event-details">
            <div class="detail-item">
                <i class="fas fa-calendar-alt"></i>
                <span>Sunday, 18-01-2026</span>
            </div>
            <div class="detail-item">
                <i class="fas fa-clock"></i>
                <span>09:00 AM - 05:00 PM</span>
            </div>
            <div class="detail-item">
                <i class="fas fa-map-marker-alt"></i>
                <span>Hotel King Fort, Kozhikode</span>
            </div>
        </div>
    </div>

    <div class="form-section">
        <h2>Secure Your Seat</h2>
        
        <form id="ajaxForm">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" name="name" placeholder="Full Name" required>
            </div>

            <div class="input-group">
                <i class="fas fa-graduation-cap"></i>
                <input type="text" name="student_name" placeholder="Student Name" required>
            </div>

            <div class="input-group">
                <i class="fas fa-location-dot"></i>
                <input type="text" name="place" placeholder="City / Place" required>
            </div>

            <div class="input-group">
                <i class="fas fa-phone"></i>
                <input type="tel" name="phone" placeholder="Phone Number" required>
            </div>

            <div class="input-group">
                <i class="fab fa-whatsapp"></i>
                <input type="tel" name="whatsapp" placeholder="WhatsApp Number" required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Register Now</button>
        </form>
        
        <div id="form-status"></div>
    </div>
</div>

<script>
    document.getElementById('ajaxForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        var btn = document.getElementById('submitBtn');
        var statusDiv = document.getElementById('form-status');
        var formData = new FormData(this);

        // UI Loading State
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
        btn.style.opacity = "0.7";
        btn.disabled = true;

        fetch('send_mail.php', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            statusDiv.style.display = 'block';
            if(data.status === 'success') {
                statusDiv.className = 'status-success';
                statusDiv.innerText = "Registration Successful! Check your email.";
                document.getElementById('ajaxForm').reset();
            } else {
                statusDiv.className = 'status-error';
                statusDiv.innerText = "Error: " + data.message;
            }
            // Reset Button
            btn.innerHTML = 'Register Now';
            btn.style.opacity = "1";
            btn.disabled = false;
        })
        .catch(error => {
            statusDiv.style.display = 'block';
            statusDiv.className = 'status-error';
            statusDiv.innerText = "Network Error. Please try again.";
            btn.innerHTML = 'Register Now';
            btn.style.opacity = "1";
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
