      <link rel="stylesheet" href="style/css/transition.css" />


  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Sora', 'sans-serif'],
          },
          colors: {
            'tera-blue-light': '#3B82F6',   /* Card 1 */

          }

      <style>
html {
  scroll-behavior: auto; /* disable native smooth */
}

body {
  overflow-x: hidden;
}
html {
  scroll-behavior: smooth;
}


      /* Width */
      ::-webkit-scrollbar {
        width: 8px; /* Slightly slimmer for elegance */
      }

      /* Track (Background) */
      ::-webkit-scrollbar-track {
        background: transparent; /* Makes it look like it's floating */
      }

      /* Handle (The gradient part) */
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(
          180deg,
          #60a5fa 0%,
          #2563eb 100%
        ); /* Blue Gradient */
        border-radius: 100vh; /* Perfectly rounded ends */
        border: 2px solid #fff; /* White border creates a 'floating' effect */
      }

      /* Handle on Hover */
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(
          180deg,
          #2563eb 0%,
          #1e40af 100%
        ); /* Darker gradient */
      }
    </style>
</head>
